name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml
          POSTGRES_DB: amlsyncai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aml" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aml:aml@localhost:5432/amlsyncai
      DATABASE_APP_URL: postgresql://app_user:app@localhost:5432/amlsyncai
      APP_URL: http://localhost:3100
      EMAIL_TRANSPORT: dev
      ALLOW_DEV_EMAIL: "1"
      SKIP_DOMAIN_CHECKS: "1"
      SKIP_BREACH_CHECK: "1"
      SCAN_MODE: basic
      AI_PROVIDER: mock
      CRON_SECRET: ci-cron-secret
      PLATFORM_ADMIN_EMAILS: triage@amlsyncai-team.lt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database
        run: |
          npx prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/rls.sql
          psql "$DATABASE_URL" -c "CREATE ROLE app_user LOGIN PASSWORD 'app'" \
            -c "GRANT USAGE ON SCHEMA public TO app_user" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user" \
            -c "GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO app_user"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser end-to-end tests
        run: |
          export MASTER_KEY=$(openssl rand -base64 32)
          npx playwright install --with-deps chromium
          npx tsx scripts/load-list.mts amlsync e2e/fixtures/test-sanctions.csv "TEST sanctions list" 2026-11-13
          PORT=3100 npm start > server.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3100/login
          ./e2e/run-all.sh
      - if: failure()
        run: tail -200 server.log || true
