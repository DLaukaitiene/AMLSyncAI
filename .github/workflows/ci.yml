name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml
          POSTGRES_DB: amlsyncai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aml" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aml:aml@localhost:5432/amlsyncai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/rls.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
